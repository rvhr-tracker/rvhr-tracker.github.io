<style>
/* Layout: one app column (phone first); admin tables scroll inside their own box. Brand ink = RVHR letterhead blue. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --fg:#18203a; --muted:#5d6782; --line:#dde2ee;
  --brand:#1F3C88; --brand-fg:#ffffff; --brand-soft:#e4eaf8;
  --ok:#1E8449; --warn:#B9770E; --bad:#C0392B; --info:#2E57B5; --idle:#7a8297; --violet:#6a5acd;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --surface:#171e33; --surface-2:#1e2741; --fg:#e8ecf7; --muted:#9aa4c0; --line:#2a3452;
  --brand:#6f8fe6; --brand-fg:#0f1424; --brand-soft:#22305a;
  --ok:#4cc27e; --warn:#e0a63a; --bad:#ef6b5c; --info:#7ea0f0; --idle:#8b93aa; --violet:#9b8cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --surface:#171e33; --surface-2:#1e2741; --fg:#e8ecf7; --muted:#9aa4c0; --line:#2a3452;
  --brand:#6f8fe6; --brand-fg:#0f1424; --brand-soft:#22305a;
  --ok:#4cc27e; --warn:#e0a63a; --bad:#ef6b5c; --info:#7ea0f0; --idle:#8b93aa; --violet:#9b8cf0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:22px;color:var(--brand)}
.brand span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.demo{background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.06em;margin-left:6px;vertical-align:middle}
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=tel],input[type=email],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
label.who{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:250px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.primary{background:var(--brand);color:var(--brand-fg)}
.ghost{background:var(--surface-2);color:var(--fg)}
.okb{background:var(--ok);color:#fff}
.badb{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
nav.tabs button{background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
h3{font-family:var(--display);font-size:18px;margin:0 0 10px;text-wrap:balance}
h4{margin:6px 0;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px}

.s-int{background:var(--idle)}.s-fix{background:var(--info)}.s-came{background:var(--violet)}.s-sel{background:var(--warn)}.s-join{background:var(--ok)}.s-pend{background:#8e44ad}.s-rej{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.actions button{padding:6px 10px;font-size:13px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;color:#fff;white-space:nowrap}

.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;gap:10px}
.form2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form label,.form2 label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:16px;overflow-y:auto}
.modal .panel{max-width:520px;width:100%;margin-block:20px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;flex:none}
.big{font-family:var(--display);font-size:42px;font-variant-numeric:tabular-nums;color:var(--brand)}
.zone{border-radius:12px;padding:12px;color:#fff;font-weight:600}
.z-ok{background:var(--ok)}.z-bad{background:var(--bad)}.z-warn{background:var(--warn)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.selfie{width:72px;height:72px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;flex:none}
.rules{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2);font-size:14px}
.rules li{margin:4px 0}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
code{font-size:13px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

/* ---- live app additions (same look as demo) ---- */
html{background:var(--bg)}body{margin:0;-webkit-tap-highlight-color:transparent}
input[type=password],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input,select,textarea{font-size:16px}
input[type=file]{font-size:14px;color:var(--muted);width:100%;display:block;min-height:46px;padding:3px 0;line-height:1.3;overflow:visible}
input[type=file]::file-selector-button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;margin-right:10px;background:var(--brand-soft);color:var(--brand)}
nav.tabs button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.n{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.t{font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px;border-bottom:0;padding:4px 0}
.c-Interested{background:var(--idle)}.c-Interview{background:var(--info)}.c-aaya{background:var(--violet)}.c-Selected{background:var(--warn)}.c-pending{background:#8e44ad}.c-Joined{background:var(--ok)}.c-Rejected{background:var(--bad)}
.rules{white-space:pre-line;max-height:none}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--info);z-index:40}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
td{white-space:normal}
header.top{align-items:center}
#installBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:10px 12px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
#installBar button{padding:8px 14px}
</style></head>

<div class="wrap">

<script>
/* google.script.run shim -> Apps Script JSON API */
(function(){var API='https://script.google.com/macros/s/AKfycbwGpXwX-u0bof3JdouHemOBxjZ30kvJBpthvuREt1tGhIOkcaNUd1WDPErOcpI6wZY7uA/exec';
function mk(ok,fail){return new Proxy({},{get:function(t,p){
 if(p==='withSuccessHandler')return function(f){return mk(f,fail)};
 if(p==='withFailureHandler')return function(f){return mk(ok,f)};
 return function(){var args=[].slice.call(arguments);
  fetch(API,{method:'POST',body:JSON.stringify({fn:p,args:args}),redirect:'follow'})
  .then(function(r){return r.json()})
  .then(function(j){if(j.ok){ok&&ok(j.data)}else{fail&&fail({message:j.error})}})
  .catch(function(){fail&&fail({message:'Internet issue – network check karke dobara try karein'})})}}})}
window.google={script:{run:mk()}};
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})}
var dp=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;var b=document.getElementById('installBar');if(b&&!localStorage.getItem('ib_no'))b.hidden=false});
document.addEventListener('click',function(e){var b=document.getElementById('installBar');if(!b)return;
 if(e.target.id==='ibYes'&&dp){dp.prompt();dp.userChoice.then(function(){b.hidden=true;dp=null})}
 if(e.target.id==='ibNo'){b.hidden=true;try{localStorage.setItem('ib_no','1')}catch(_){}}});
})();
</script>
<script>
var ATT=[],EMPS=[],TOKEN=null, ME=null, TAB=null, HOME=null, ADMIN=null, MASTER=null, MDATA=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3000)}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
try{TOKEN=localStorage.getItem('rvhr_tok');ME=JSON.parse(localStorage.getItem('rvhr_me')||'null');MASTER=JSON.parse(localStorage.getItem('rvhr_master')||'null')}catch(e){}
function saveSess(){try{localStorage.setItem('rvhr_tok',TOKEN||'');localStorage.setItem('rvhr_me',JSON.stringify(ME));localStorage.setItem('rvhr_master',JSON.stringify(MASTER))}catch(e){}}
/** call server: run('fn', args..., cb) – any change clears the read cache */
var CACHE={},INFLIGHT=0;function busy(d){INFLIGHT=Math.max(0,INFLIGHT+d);$('#busy').hidden=INFLIGHT===0}
function run(fn){var args=[].slice.call(arguments,1),cb=args.pop();busy(1);
  var r=google.script.run.withSuccessHandler(function(x){busy(-1);CACHE={};cb(x)}).withFailureHandler(function(e){busy(-1);
    var m=(e&&e.message)||String(e); if(m.indexOf('SESSION')>=0){logout();toast(m.replace('SESSION: ',''));return} toast(m)});
  r[fn].apply(r,args)}
/** read with cache: shows last data instantly, refreshes in background, re-renders only if data changed */
function load(fn){var args=[].slice.call(arguments,1),cb=args.pop(),key=fn+'|'+JSON.stringify(args.slice(1)),tab=TAB,who=ME&&ME.code,c=CACHE[key];
 if(c&&cb)cb(c.v);if(c&&c.p)return;
 if(c)c.p=1;busy(1);
 var r=google.script.run.withSuccessHandler(function(x){busy(-1);var st=JSON.stringify(x);var same=c&&c.s===st;CACHE[key]={v:x,s:st,t:Date.now()};
   if(!same&&cb&&TAB===tab&&ME&&ME.code===who)cb(x)})
  .withFailureHandler(function(e){busy(-1);if(c)delete c.p;var m=(e&&e.message)||String(e);if(m.indexOf('SESSION')>=0){logout();toast(m.replace('SESSION: ',''));return}if(cb&&!c)toast(m)});
 r[fn].apply(r,args)}
function warm(){if(!TOKEN||!ME)return;var L={Recruiter:['getMyCandidates','getOpenings','employees'],Admin:['employees'],Compliance:['employees'],Master:['adminData','employees','complianceData']}[ME.role]||[];
 L.forEach(function(f,i){setTimeout(function(){if(TOKEN)load(f,TOKEN,null)},300+i*250)})}
function devId(){try{var d=localStorage.getItem('rvhr_dev');if(!d){d='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);localStorage.setItem('rvhr_dev',d)}return d}catch(e){return 'UA'+btoa(unescape(encodeURIComponent(navigator.userAgent))).slice(-30)}}
function csv(name,rows){var t=rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function modal(html){var m=$('#modal');m.hidden=false;m.innerHTML='<div class="panel">'+html+'<div class="actions"><button type="button" class="ghost" id="mx">Band karo</button></div></div>';$('#mx').onclick=function(){m.hidden=true;m.innerHTML=''};return m}
function viewFile(id,name){run('getFile',TOKEN,id,function(f){
  if(/^image\//.test(f.type))modal('<h3>'+esc(name||f.name)+'</h3><img src="'+f.data+'" alt="" style="max-width:100%;border-radius:10px">');
  else{var b=atob(f.data.split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);var url=URL.createObjectURL(new Blob([u],{type:f.type}));
   modal('<h3>'+esc(name||f.name)+'</h3><p><a href="'+url+'" target="_blank" rel="noopener" download="'+esc(f.name)+'">File kholo / download karo</a></p>'+(f.type==='application/pdf'?'<iframe src="'+url+'" style="width:100%;height:70vh;border:0;border-radius:10px"></iframe>':''))}})}
function viewDocs(key){run('docList',TOKEN,key,function(d){modal('<h3>Documents – '+esc(d.name)+'</h3>'+(d.files.length?'<div class="list">'+d.files.map(function(f){return '<div class="item"><span>'+esc(f.name)+'</span><button class="primary" data-file="'+esc(f.id)+'" data-fname="'+esc(f.name)+'">Dekho</button></div>'}).join('')+'</div>':'<p class="muted">Koi document nahi mila.</p>'))})}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-file],[data-docs]');if(!t)return;e.preventDefault();
 if(t.dataset.file)viewFile(t.dataset.file,t.dataset.fname);else viewDocs(t.dataset.docs)});
function openCam(cb){var m=modal('<h3>Live selfie</h3><p class="muted">Camera ke saamne seedha dekho. Gallery ki photo nahi chalegi.</p><video id="cv" autoplay playsinline muted style="width:100%;max-height:60vh;border-radius:12px;background:#000;transform:scaleX(-1)"></video><div class="actions"><button class="okb" id="cshot" disabled>Photo lo</button></div>'),st=null;
 var stop=function(){if(st)st.getTracks().forEach(function(t){t.stop()})};$('#mx').addEventListener('click',stop);
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stop();m.hidden=true;toast('Is phone me live camera nahi chal raha – Chrome update karein');return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960}},audio:false}).then(function(s){st=s;var v=$('#cv');v.srcObject=s;v.onloadedmetadata=function(){$('#cshot').disabled=false}})
 .catch(function(){m.hidden=true;toast('Camera ki permission do – browser settings me Camera = Allow')});
 $('#cshot').onclick=function(){var v=$('#cv'),w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth),c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  x.translate(w,0);x.scale(-1,1);x.drawImage(v,0,0,w,h);x.setTransform(1,0,0,1,0,0);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-34,w,34);x.fillStyle='#fff';x.font='16px sans-serif';
  x.fillText((ME?ME.name+' · '+ME.code+' · ':'')+new Date().toLocaleString('en-IN'),10,h-11);stop();m.hidden=true;cb(c.toDataURL('image/jpeg',0.8))}}
function logout(){CACHE={};if(TOKEN){try{google.script.run.logout(TOKEN)}catch(e){}}TOKEN=null;ME=null;MASTER=null;try{localStorage.removeItem('rvhr_tok');localStorage.removeItem('rvhr_me');localStorage.removeItem('rvhr_master')}catch(e){}render()}
$('#asBack').onclick=function(){CACHE={};TOKEN=MASTER.token;ME=MASTER.me;MASTER=null;TAB='as';saveSess();render()};
$('#logoutBtn').onclick=logout;

/* image -> compressed dataURL */
function readImg(file,max,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.8))};im.src=fr.result};fr.readAsDataURL(file)}
function gps(cb){if(!navigator.geolocation){toast('Phone me location support nahi');return}
 navigator.geolocation.getCurrentPosition(function(p){cb(p.coords.latitude,p.coords.longitude,p.coords.accuracy)},function(){toast('Location nahi mili – GPS on karo aur browser ko location ki permission do')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}

/* ---------------- login ---------------- */
function viewLogin(){$('#tabs').innerHTML='';$('#logoutBtn').hidden=true;$('#sub').textContent='RV HR Carrers Pvt. Ltd.';
 $('#view').innerHTML='<div class="panel" style="max-width:380px;margin:30px auto"><h3>Login</h3><form class="form" id="lf"><label>Code<input type="text" id="lc" placeholder="Jaise RV0008" autocomplete="username"></label><label>PIN<input type="password" id="lp" inputmode="numeric" autocomplete="current-password"></label><button class="primary">Login</button></form><p class="muted">Code aur PIN Vinod ji se milega.</p></div>';
 $('#lf').onsubmit=function(e){e.preventDefault();run('login',$('#lc').value.trim(),$('#lp').value,devId(),function(r){CACHE={};TOKEN=r.token;ME=r.me;setTimeout(warm,1500);try{localStorage.setItem('rvhr_tok',TOKEN);localStorage.setItem('rvhr_me',JSON.stringify(ME))}catch(x){}TAB=null;render()})}}

function tabs(list){if(!TAB)TAB=list[0][0];$('#tabs').innerHTML=list.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>'}).join('');
 [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){TAB=b.dataset.t;$('#view').innerHTML='<div class="panel"><p class="muted">Load ho raha hai…</p></div>';render()}})}

function render(){ if(!TOKEN||!ME) return viewLogin();

 $('#view').innerHTML='<div class="panel" style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:18px"><div><div class="n">'+L.length+'</div><div class="muted">Kul</div></div>'+Object.keys(cnt).sort().map(function(k){return '<div><div class="n">'+cnt[k]+'</div><div class="muted">'+esc(k)+'</div></div>'}).join('')+'</div>'+
 '<div class="panel"><h3>'+(staff?'Saare employees (DBMS se live)':'Mere employees (jo maine join karwaye)')+'</h3><div class="form2" style="margin-bottom:10px"><label>Dhundho<input type="text" id="eq" placeholder="Naam / RVHR code / mobile"></label><label>Status<select id="es"><option value="">Sab</option>'+Object.keys(cnt).sort().map(function(k){return '<option>'+esc(k)+'</option>'}).join('')+'</select></label><label>Client<select id="ec"><option value="">Sab</option>'+clients.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select></label></div>'+
 (staff?'<div class="actions" style="margin-bottom:8px"><button class="ghost" id="ecsv">Excel (CSV) download</button></div>':'')+'<div id="elist"></div></div>';
 var draw=function(){var q=$('#eq').value.toLowerCase().trim(),st=$('#es').value,cl=$('#ec').value;
  var f=L.filter(function(e){return (!st||(e.status||'—')===st)&&(!cl||e.client===cl)&&(!q||(e.name+' '+e.code+' '+e.mobile).toLowerCase().indexOf(q)>=0)});
  $('#elist').innerHTML='<p class="muted">'+f.length+' employees</p><div class="tbl"><table><tr><th>Employee</th><th>Client / Pad</th><th>Status</th><th>Joining</th><th>Last payroll</th>'+(staff?'<th>Recruiter</th>':'')+'<th></th></tr>'+
   f.slice(0,400).map(function(e){return '<tr><td><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.code)+' · '+esc(e.mobile)+'</span></td><td>'+esc(e.client)+'<br><span class="muted">'+esc(e.desig)+' '+esc(e.type)+'</span></td><td>'+stPill(e.status)+(e.dol?'<br><span class="muted">chhoda '+esc(e.dol)+'</span>':'')+'</td><td>'+esc(e.doj)+'</td><td>'+esc(e.lastPay)+'</td>'+(staff?'<td>'+esc(e.recruiter)+'</td>':'')+'<td><button class="ghost" style="padding:5px 10px;font-size:13px" data-emp="'+esc(e.code)+'">Detail</button></td></tr>'}).join('')+'</table></div>'+(f.length>400?'<p class="muted">Pehle 400 dikhaye – search se chhota karo.</p>':'');
  [].forEach.call(document.querySelectorAll('[data-emp]'),function(b){b.onclick=function(){empDetail(L.filter(function(x){return x.code===b.dataset.emp})[0])}})};
 $('#eq').oninput=draw;$('#es').onchange=draw;$('#ec').onchange=draw;draw();
 if($('#ecsv'))$('#ecsv').onclick=function(){var k=['code','name','client','status','doj','dol','desig','type','mobile','lastPay','recruiter','station','father','gender','dob','email','address','pan','aadhaar','uan','esic','bank','ifsc','bankName','pending','flags'];
  csv('RVHR Employees '+new Date().toISOString().slice(0,10),[k].concat(L.map(function(e){return k.map(function(x){return e[x]})})))}}
function empDetail(e){var staff=ME.role!=='Recruiter';
 var rows=[['Code',e.code],['Naam',e.name],['Client',e.client],['Pad',e.desig],['Type',e.type],['Site',e.station],['Status',e.status],['Joining',e.doj],['Chhoda',e.dol],['Mobile',e.mobile],['Last payroll',e.lastPay],['Recruiter',e.recruiter]];
 if(staff)rows=rows.concat([['Father/Mother',e.father],['Gender',e.gender],['DOB',e.dob],['Email',e.email],['Address',e.address],['PAN',e.pan],['Aadhaar',e.aadhaar],['UAN',e.uan],['ESIC',e.esic],['Bank',(e.bank||'')+' '+(e.bankName||'')],['IFSC',e.ifsc],['Client emp code',e.clientCode],['Pending docs',e.pending],['Flags',e.flags],['History',e.detail]]);
 var m=modal('<h3>'+esc(e.name)+'</h3><div class="tbl"><table>'+rows.filter(function(r){return String(r[1]||'').trim()}).map(function(r){return '<tr><th>'+esc(r[0])+'</th><td style="white-space:normal">'+esc(r[1])+'</td></tr>'}).join('')+'</table></div>'+
  (e.docs?'<div class="actions"><button class="ghost" data-docs="'+esc(e.code)+'">Documents dekho</button></div>':'')+
  (staff?'<h4>Status badlo</h4><div class="form2"><label>Status<select id="ns"><option>Active</option><option>Left</option><option>Inactive</option></select></label><label>Chhodne ki date (Left ho to)<input type="date" id="nd"></label><label style="grid-column:1/-1">Note<input type="text" id="nn" placeholder="Jaise: khud chhoda / absconded"></label></div><div class="actions"><button class="primary" id="nsv">Save – DBMS me</button></div>':''));
 if($('#nsv'))$('#nsv').onclick=function(){run('setEmpStatus',TOKEN,e.code,$('#ns').value,$('#nd').value,$('#nn').value,function(){m.hidden=true;toast('DBMS me update ho gaya');empView()})}}
function pinView(){$('#view').innerHTML='<div class="panel" style="max-width:420px"><h3>Apna PIN badlo</h3><form class="form" id="pf2"><label>Purana PIN<input type="password" id="p0" inputmode="numeric" autocomplete="current-password"></label><label>Naya PIN ('+(ME.role==='Recruiter'?'4-6':'6')+' digit)<input type="password" id="p1" inputmode="numeric" autocomplete="new-password"></label><label>Naya PIN dobara<input type="password" id="p2" inputmode="numeric" autocomplete="new-password"></label><button class="primary">PIN badlo</button></form><p class="muted">PIN kisi ko mat batana. 1111 / 1234 jaise aasaan PIN nahi chalenge.</p></div>';
 $('#pf2').onsubmit=function(ev){ev.preventDefault();if($('#p1').value!==$('#p2').value)return toast('Dono naye PIN alag hain');run('changePin',TOKEN,$('#p0').value,$('#p1').value,function(){toast('PIN badal gaya');$('#pf2').reset()})}}


render();if(TOKEN&&ME)setTimeout(warm,1500);
</script>
</body></html>
