<script>
/* google.script.run shim -> Apps Script JSON API */
(function(){var API='https://script.google.com/macros/s/AKfycbwGpXwX-u0bof3JdouHemOBxjZ30kvJBpthvuREt1tGhIOkcaNUd1WDPErOcpI6wZY7uA/exec';
function mk(ok,fail){return new Proxy({},{get:function(t,p){
 if(p==='withSuccessHandler')return function(f){return mk(f,fail)};
 if(p==='withFailureHandler')return function(f){return mk(ok,f)};
 return function(){var args=[].slice.call(arguments);
  fetch(API,{method:'POST',body:JSON.stringify({fn:p,args:args}),redirect:'follow'})
  .then(function(r){return r.json()})
  .then(function(j){if(j.ok){ok&&ok(j.data)}else{fail&&fail({message:j.error})}})
  .catch(function(){fail&&fail({message:'Internet issue – network check karke dobara try karein'})})}}})}
window.google={script:{run:mk()}};
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})}

document.addEventListener('click',function(e){var b=document.getElementById('installBar');if(!b)return;
 if(e.target.id==='ibYes'&&dp){dp.prompt();dp.userChoice.then(function(){b.hidden=true;dp=null})}
 if(e.target.id==='ibNo'){b.hidden=true;try{localStorage.setItem('ib_no','1')}catch(_){}}});
})();

<script>
var ATT=[],EMPS=[],TOKEN=null, ME=null, TAB=null, HOME=null, ADMIN=null, MASTER=null, MDATA=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3000)}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
try{TOKEN=localStorage.getItem('rvhr_tok');ME=JSON.parse(localStorage.getItem('rvhr_me')||'null');MASTER=JSON.parse(localStorage.getItem('rvhr_master')||'null')}catch(e){}
function saveSess(){try{localStorage.setItem('rvhr_tok',TOKEN||'');localStorage.setItem('rvhr_me',JSON.stringify(ME));localStorage.setItem('rvhr_master',JSON.stringify(MASTER))}catch(e){}}
/** call server: run('fn', args..., cb) – any change clears the read cache */
var CACHE={},INFLIGHT=0;function busy(d){INFLIGHT=Math.max(0,INFLIGHT+d);$('#busy').hidden=INFLIGHT===0}
function run(fn){var args=[].slice.call(arguments,1),cb=args.pop();busy(1);
  var r=google.script.run.withSuccessHandler(function(x){busy(-1);CACHE={};cb(x)}).withFailureHandler(function(e){busy(-1);
    var m=(e&&e.message)||String(e); if(m.indexOf('SESSION')>=0){logout();toast(m.replace('SESSION: ',''));return} toast(m)});
  r[fn].apply(r,args)}
/** read with cache: shows last data instantly, refreshes in background, re-renders only if data changed */
function load(fn){var args=[].slice.call(arguments,1),cb=args.pop(),key=fn+'|'+JSON.stringify(args.slice(1)),tab=TAB,who=ME&&ME.code,c=CACHE[key];
 if(c&&cb)cb(c.v);if(c&&c.p)return;
 if(c)c.p=1;busy(1);
 var r=google.script.run.withSuccessHandler(function(x){busy(-1);var st=JSON.stringify(x);var same=c&&c.s===st;CACHE[key]={v:x,s:st,t:Date.now()};
   if(!same&&cb&&TAB===tab&&ME&&ME.code===who)cb(x)})
  .withFailureHandler(function(e){busy(-1);if(c)delete c.p;var m=(e&&e.message)||String(e);if(m.indexOf('SESSION')>=0){logout();toast(m.replace('SESSION: ',''));return}if(cb&&!c)toast(m)});
 r[fn].apply(r,args)}
function warm(){if(!TOKEN||!ME)return;var L={Recruiter:ME.mode==='WFH'?['getMyCandidates','employees']:['getMyCandidates','getOpenings','employees'],Admin:['employees'],Compliance:['employees'],Master:['adminData','employees','complianceData']}[ME.role]||[];
 L.forEach(function(f,i){setTimeout(function(){if(TOKEN)load(f,TOKEN,null)},300+i*250)})}
function devId(){try{var d=localStorage.getItem('rvhr_dev');if(!d){d='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);localStorage.setItem('rvhr_dev',d)}return d}catch(e){return 'UA'+btoa(unescape(encodeURIComponent(navigator.userAgent))).slice(-30)}}
function csv(name,rows){var t=rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function modal(html){var m=$('#modal');m.classList.remove('sheetm');m.hidden=false;m.innerHTML='<div class="panel">'+html+'<div class="actions"><button type="button" class="ghost" id="mx">Band karo</button></div></div>';$('#mx').onclick=function(){m.hidden=true;m.innerHTML=''};return m}
function viewFile(id,name){run('getFile',TOKEN,id,function(f){
  if(/^image\//.test(f.type))modal('<h3>'+esc(name||f.name)+'</h3><img src="'+f.data+'" alt="" style="max-width:100%;border-radius:10px">');
  else{var b=atob(f.data.split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);var url=URL.createObjectURL(new Blob([u],{type:f.type}));
   modal('<h3>'+esc(name||f.name)+'</h3><p><a href="'+url+'" target="_blank" rel="noopener" download="'+esc(f.name)+'">File kholo / download karo</a></p>'+(f.type==='application/pdf'?'<iframe src="'+url+'" style="width:100%;height:70vh;border:0;border-radius:10px"></iframe>':''))}})}
function viewDocs(key){run('docList',TOKEN,key,function(d){modal('<h3>Documents – '+esc(d.name)+'</h3>'+(d.files.length?'<div class="list">'+d.files.map(function(f){return '<div class="item"><span>'+esc(f.name)+'</span><button class="primary" data-file="'+esc(f.id)+'" data-fname="'+esc(f.name)+'">Dekho</button></div>'}).join('')+'</div>':'<p class="muted">Koi document nahi mila.</p>'))})}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-file],[data-docs]');if(!t)return;e.preventDefault();
 if(t.dataset.file)viewFile(t.dataset.file,t.dataset.fname);else viewDocs(t.dataset.docs)});
function openCam(cb){var m=modal('<h3>Live selfie</h3><p class="muted">Camera ke saamne seedha dekho. Gallery ki photo nahi chalegi.</p><video id="cv" autoplay playsinline muted style="width:100%;max-height:60vh;border-radius:12px;background:#000;transform:scaleX(-1)"></video><div class="actions"><button class="okb" id="cshot" disabled>Photo lo</button></div>'),st=null;
 var stop=function(){if(st)st.getTracks().forEach(function(t){t.stop()})};$('#mx').addEventListener('click',stop);
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stop();m.hidden=true;toast('Is phone me live camera nahi chal raha – Chrome update karein');return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960}},audio:false}).then(function(s){st=s;var v=$('#cv');v.srcObject=s;v.onloadedmetadata=function(){$('#cshot').disabled=false}})
 .catch(function(){m.hidden=true;toast('Camera ki permission do – browser settings me Camera = Allow')});
 $('#cshot').onclick=function(){var v=$('#cv'),w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth),c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  x.translate(w,0);x.scale(-1,1);x.drawImage(v,0,0,w,h);x.setTransform(1,0,0,1,0,0);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-34,w,34);x.fillStyle='#fff';x.font='16px sans-serif';
  x.fillText((ME?ME.name+' · '+ME.code+' · ':'')+new Date().toLocaleString('en-IN'),10,h-11);stop();m.hidden=true;cb(c.toDataURL('image/jpeg',0.8))}}
function logout(){CACHE={};if(TOKEN){try{google.script.run.logout(TOKEN)}catch(e){}}TOKEN=null;ME=null;MASTER=null;try{localStorage.removeItem('rvhr_tok');localStorage.removeItem('rvhr_me');localStorage.removeItem('rvhr_master')}catch(e){}render()}

/* image -> compressed dataURL */
function readImg(file,max,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.8))};im.src=fr.result};fr.readAsDataURL(file)}
function gps(cb){if(!navigator.geolocation){toast('Phone me location support nahi');return}
 navigator.geolocation.getCurrentPosition(function(p){cb(p.coords.latitude,p.coords.longitude,p.coords.accuracy)},function(){toast('Location nahi mili – GPS on karo aur browser ko location ki permission do')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}

var TELE=null,TELEAT=0,TDATA=null,TDATE='';
function hmin(m){m=+m||0;return (m>=60?Math.floor(m/60)+'h ':'')+(m%60)+'m'}
function teleView(){load('teleHome',TOKEN,function(h){HOME=h;TELE=h;TELEAT=Date.now();ME=h.me;if(!ME.accepted)return viewGate();TAB==='rules'?viewRules():viewTele()})}
function oc(o){return o==='Interested'||o==='Interview fixed'?'p-ok':o==='Callback'?'p-info':o==='Not interested'?'p-warn':'p-bad'}
setInterval(function(){if(!TELE||!ME||ME.mode!=='WFH'||TAB!=='home'||!$('#modal').hidden)return;var busyForm=$('#cf')&&($('#cm').value||$('#cn').value||$('#cnote').value);if(!busyForm)viewTele()},60000);
